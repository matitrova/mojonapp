<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Imagen de RESERVA para la tarjeta que se ve al compartir un link.
       Solo se usa cuando el lote no tiene fotos: si las tiene, la
       tarjeta lleva la foto de la propiedad (ver functions/_middleware.js),
       que es lo que hace cualquier portal y lo que de verdad hace que
       alguien abra el link.

       NO DICE "MojonApp". Esta imagen la ve un comprador al que le
       mandaron una propiedad, no alguien evaluando el software: el
       nombre del producto ahí no le dice nada, y peor, le tapa a la
       inmobiliaria. Antes decía el nombre del producto en grande.

       Paleta del rediseño de 2026-09-18 (naranja como único color de
       marca, fondo gris azulado, ver :root en css/estilos.css) — la
       anterior era la cálida/rural que ya no usa ninguna pantalla.

       Sin fuentes externas: system-ui, igual que si no cargara nada. -->
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f8fa" />
      <stop offset="1" stop-color="#eceff4" />
    </linearGradient>
    <pattern id="tramaSutil" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M0 48 L24 0 L48 48" fill="none" stroke="#dfe4ec" stroke-width="1" opacity="0.6" />
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#fondo)" />
  <rect width="1200" height="630" fill="url(#tramaSutil)" />

  <!-- "Imagen satelital" estilizada: parches irregulares, como manzanas
       de un loteo vistas desde arriba. -->
  <g opacity="0.9">
    <rect x="760" y="40" width="180" height="150" rx="8" fill="#94a3b8" opacity="0.30" />
    <rect x="960" y="70" width="150" height="130" rx="8" fill="#64748b" opacity="0.26" />
    <rect x="800" y="210" width="160" height="140" rx="8" fill="#64748b" opacity="0.22" />
    <rect x="980" y="220" width="140" height="160" rx="8" fill="#94a3b8" opacity="0.28" />
    <rect x="760" y="370" width="170" height="150" rx="8" fill="#94a3b8" opacity="0.24" />
    <rect x="960" y="400" width="160" height="140" rx="8" fill="#64748b" opacity="0.28" />
  </g>

  <!-- El lote: el límite real dibujado sobre la imagen, con sus
       vértices marcados. Es la idea central del producto y lo único
       que esta imagen necesita comunicar. -->
  <polygon points="840,220 990,190 1030,320 900,380 830,320"
           fill="#e2591f" fill-opacity="0.18" stroke="#e2591f" stroke-width="5"
           stroke-dasharray="2 10" stroke-linecap="round" />
  <g fill="#e2591f">
    <circle cx="840" cy="220" r="7" />
    <circle cx="990" cy="190" r="7" />
    <circle cx="1030" cy="320" r="7" />
    <circle cx="900" cy="380" r="7" />
    <circle cx="830" cy="320" r="7" />
  </g>

  <text x="80" y="290" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="64" font-weight="800" fill="#0f172a">El límite real</text>
  <text x="80" y="366" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="64" font-weight="800" fill="#0f172a">del terreno</text>
  <text x="80" y="424" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="30" font-weight="600" fill="#64748b">sobre la imagen satelital, no un pin</text>

  <rect x="80" y="468" width="196" height="54" rx="27" fill="#e2591f" />
  <circle cx="113" cy="495" r="7" fill="#fff" />
  <text x="134" y="504" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="24" font-weight="700" fill="#fff">Disponible</text>
</svg>
