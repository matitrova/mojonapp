name: Tests

# Corre el mismo suite de pytest que hasta ahora se corría a mano antes
# de cada commit — no hay build step en este proyecto (sitio estático
# sin bundler, decisión deliberada), así que este workflow no compila
# nada, solo levanta el servidor estático de prueba y corre Playwright
# contra el proyecto real de Firebase (no hay emulador instalado, ver
# tests/conftest.py) igual que en local.
#
# Necesita dos secrets del repo (Settings > Secrets and variables >
# Actions), las mismas credenciales que ya viven en tests/.env en local:
#   TEST_USER_EMAIL
#   TEST_USER_PASSWORD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r tests/requirements.txt

      - name: Instalar navegadores de Playwright
        run: playwright install --with-deps chromium

      - name: Correr tests
        env:
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: pytest tests/ -v
