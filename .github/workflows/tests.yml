name: Tests

# Corre el mismo suite de pytest que se corría a mano antes de cada
# commit — no hay build step en este proyecto (sitio estático sin
# bundler, decisión deliberada), así que este workflow no compila nada:
# levanta el servidor estático de prueba y corre Playwright contra el
# proyecto REAL de Firebase (no hay emulador instalado, ver
# tests/conftest.py) igual que en local.
#
# Necesita dos secrets del repo (Settings > Secrets and variables >
# Actions), las mismas credenciales que viven en tests/.env en local:
#   TEST_USER_EMAIL
#   TEST_USER_PASSWORD
#
# ---------------------------------------------------------------------
# POR QUÉ ESTO YA NO CORRE EN CADA PUSH (2026-09-16)
#
# Correr la suite contra Firebase de verdad tiene un costo real: cada
# test inicia sesión, siembra datos y lee la colección de lotes entera.
# Medido: UNA corrida completa agota las 50.000 lecturas diarias del plan
# gratuito de Firestore, y cuando la cuota se agota Firestore deja de
# responder para TODOS. Pasó en vivo: diez pushes a main en un día
# dejaron mojonapp.com.ar sin cargar un solo lote para los visitantes.
#
# Desde b71c639 la suite apunta a un proyecto Firebase aparte, así que
# agotar la cuota ya no voltea la app del cliente. Pero el límite de
# 50.000 lecturas es POR PROYECTO: el de pruebas tiene el suyo, y una
# corrida completa se lo come igual. Correr en cada push seguiría dando
# corridas en rojo por 429 a partir de la segunda del día.
#
# Por eso los tests pasan a correr una vez por día y cuando alguien los
# pide, en vez de en cada push. Es un intercambio consciente: se pierde
# el aviso inmediato de que un commit rompió algo, y a cambio la app no
# se cae. Con muchos pushes por día, el aviso inmediato era ilusorio de
# todos modos — las corridas se pisaban entre sí.
#
# Si el proyecto pasa al plan Blaze (pago por uso), este límite
# desaparece: ahí las mismas 50.000 lecturas siguen siendo gratis y el
# excedente se cobra centavos en vez de cortar el servicio. En ese caso
# se puede volver a poner `push: branches: [main]` acá abajo sin drama.
# ---------------------------------------------------------------------

on:
  # A pedido, desde la pestaña Actions del repo. Esta es la forma de
  # correrlos antes de mostrarle la app a alguien o antes de un cambio
  # grande, que es cuando de verdad importa.
  workflow_dispatch:

  # Una vez por día a las 08:00 UTC = 05:00 en Argentina. A propósito
  # DESPUÉS del reseteo de la cuota de Firestore (medianoche del
  # Pacífico, ~04:00 argentina): así la corrida consume la cuota del día
  # nuevo a primera hora y queda margen de sobra para el uso real de la
  # app durante el resto del día.
  schedule:
    - cron: "0 8 * * *"

  # Los pull requests sí: son deliberados y poco frecuentes acá, y es el
  # momento donde un test en rojo evita que algo roto entre a main.
  pull_request:

# Si entran varios pushes o commits seguidos en un PR, deja viva solo la
# última corrida y cancela las anteriores. Sin esto, cinco commits
# seguidos son cinco suites completas corriendo en paralelo contra la
# misma base — cinco veces la cuota para responder una sola pregunta.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r tests/requirements.txt

      - name: Instalar navegadores de Playwright
        run: playwright install --with-deps chromium

      - name: Correr tests
        env:
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          # Sin estos dos, conftest.py cae en su valor por defecto — que es
          # PRODUCCIÓN. O sea que la suite separada del proyecto real
          # (commit b71c639) solo aplicaba corriendo en local con
          # tests/.env: en GitHub seguía escribiendo en la base del
          # cliente. Si los secrets no están cargados, conftest avisa por
          # stderr antes de empezar.
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: pytest tests/ -v
